# =====================================================================
#  VGrid settings (read every time the app starts or you press Retry)
#  Do not commit your real MySQL password or API key to a public repository.
# =====================================================================

# ---- Where VGrid stores accounts, bookings, check-ins, alerts and settings ----
# mysql  = MySQL database (falls back to offline mode if MySQL cannot be reached)
# memory = offline mode, nothing is saved after closing
data.mode=mysql

# The "vgrid" database and all tables are created automatically on first start.
db.url=jdbc:mysql://localhost:3306/vgrid?createDatabaseIfNotExist=true&connectTimeout=4000&allowPublicKeyRetrieval=true

# Your MySQL username and password (the ones you chose when installing MySQL).
db.user=root
db.password=mynameisektasingh

# ---- Real charging stations from Open Charge Map ----
# Free API key: sign up at https://openchargemap.org and register an application in your profile.
# Without a key, Pune uses 10 built-in sample stations and other cities cannot be loaded.
ocm.api.key=72a8124f-2e91-4e1a-b611-1808c318cc1b

# Maximum number of stations downloaded per city (10 - 500).
ocm.max.results=100

# ---- OCPP server (run-ocpp-server.bat) ----
# Chargers connect to ws://localhost:<port>/ocpp/<chargePointId>
ocpp.port=8887
# City where the "VGrid OCPP Test Station" (chargers VGRID-<CITY>-C1 ... C4) is created:
# pune, mumbai, delhi, bengaluru, hyderabad or chennai
ocpp.test.city=pune
